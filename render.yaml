services:
  - type: web
    name: llm-observability-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m alembic upgrade head && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Render's own free Postgres expires ~30 days after creation (hit this
      # exact wall on 2026-11-12) - moved to Neon's free tier instead, which
      # has no calendar expiry, just usage caps (1GB storage, 100 compute-hrs/
      # month). sync: false means Render won't try to manage this value from
      # the blueprint - set the real connection string by hand in the
      # dashboard's Environment tab instead, never commit it here.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "1440"
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:5173,http://127.0.0.1:5173,https://llm-observability-dashboard-ps8c.onrender.com

  - type: web
    name: llm-observability-dashboard
    runtime: static
    rootDir: dashboard
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://llm-observability-backend-48ov.onrender.com
    routes:
      # Client-side routing (react-router) - unknown paths must still serve
      # index.html so the SPA's own router handles them, not a 404 from Render.
      - type: rewrite
        source: /*
        destination: /index.html
