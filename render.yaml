databases:
  - name: llm-observability-db
    plan: free
    databaseName: llm_observability
    user: llm_observability

services:
  - type: web
    name: llm-observability-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m alembic upgrade head && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: llm-observability-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "1440"
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:5173,http://127.0.0.1:5173,https://llm-observability-dashboard.onrender.com

  - type: web
    name: llm-observability-dashboard
    runtime: static
    rootDir: dashboard
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://llm-observability-backend-48ov.onrender.com
    routes:
      # Client-side routing (react-router) - unknown paths must still serve
      # index.html so the SPA's own router handles them, not a 404 from Render.
      - type: rewrite
        source: /*
        destination: /index.html
